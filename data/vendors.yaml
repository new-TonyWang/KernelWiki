## Vendor Registry
## Defines known GPU vendors, their architectures, and compute stacks.
## Consumed by scripts/validate.py for vendor-path consistency checks.

vendors:
  - id: nvidia
    display_name: NVIDIA
    architectures: [sm100, sm100a, sm90, sm90a, sm120]
    compute_stack: [cuda, ptx, cute-dsl, triton, cutlass]
    status: active

  - id: huawei
    display_name: Huawei Ascend
    architectures: [ascend910b, ascend910c, ascend310p]
    compute_stack: [cann, mindspore, ascendc]
    status: planned

  - id: biren
    display_name: Biren
    architectures: [br100, br104]
    compute_stack: [supa, birensdk]
    status: planned
