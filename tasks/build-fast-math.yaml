notes: |
  Cover CUDA fast math intrinsics: trading precision for throughput on
  transcendental functions.

  Key topics:
  - __sinf/__cosf/__expf/__logf/__powf vs standard sinf/cosf/expf/logf/powf
  - rsqrtf (fast reciprocal square root)
  - __fdividef (fast division)
  - __fmaf_rn / __fmul_rn / __fadd_rn (rounded intrinsics)
  - --use_fast_math compiler flag (what it enables, what precision guarantees it drops)
  - __fast_relaxed_math (CUDA 12+ attribute)
  - Precision tradeoffs: max ULP error for each fast intrinsic
  - When to use: activations (gelu, silu, sigmoid), softmax exp, normalization rsqrt
  - When NOT to use: accumulation, loss computation, gradient computation

  apis.md is REQUIRED: lists all fast math intrinsics with precision guarantees.

  Microbench probe: compare throughput of __expf vs expf on a large array.
  Kernel: each thread computes expf(x) or __expf(x) for its element.
  Measure throughput (Gop/s) and max ULP error vs double-precision reference.
