notes: |
  Cover instruction-level parallelism (ILP) in CUDA kernels: hiding
  arithmetic latency by having multiple independent instruction chains
  in flight simultaneously within a single thread.

  Key topics:
  - Single vs multiple accumulator chains (e.g., 1 acc vs 4 acc for reduction)
  - #pragma unroll and its effect on ILP
  - Loop unrolling by hand (2x, 4x, 8x) to expose more independent ops
  - Grid-stride loops with multiple elements per thread (ILP by design)
  - Register pressure tradeoff: more ILP = more registers = lower occupancy
  - Latency hiding via occupancy vs latency hiding via ILP (complementary)
  - When ILP matters: compute-bound or latency-bound kernels
  - When ILP doesn't matter: memory-bound kernels (elementwise already saturates BW)

  apis.md is OPTIONAL. #pragma unroll is not really a "named API".

  Microbench probe: compare single-accumulator FMA chain vs 4-accumulator
  independent FMA chains. Same total FMA count, different ILP exposure.
  Expect 4-acc to show ~3-4x higher throughput than 1-acc (pipeline fill).
  Use the same dependent-chain technique from the canonical compute-latency
  microbench but vary the number of independent chains.
