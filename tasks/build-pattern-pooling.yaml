notes: |
  Pooling operators: max-pool, avg-pool, adaptive-pool (1D/2D/3D).

  INDEX.md: library-first (torch.nn.functional.max_pool2d / avg_pool2d /
  adaptive_avg_pool2d, cuDNN pooling). Custom path is essentially a
  2D windowed reduction — iterate over the pooling window, accumulate
  max or sum, divide by window size for avg.

  ROUTING.md: whitelist existing skills. Primary: coalescing (input tile
  loading), bank-conflict (shared memory staging for the window).
  Secondary: vectorized-access (multiple channels per thread), ilp.

  library-fallback.md: cuDNN pooling is highly optimized; torch.nn uses
  cuDNN backend by default. Document when custom is needed (non-standard
  window shapes, fused pooling+activation, etc.).

  TASK-PACKET.md: op=pooling, pool_type (max/avg/adaptive), kernel_size,
  stride, padding, shape (B,C,H,W), dtype.
