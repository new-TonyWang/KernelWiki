notes: |
  Cover the warp shuffle family (shfl.sync.idx / up / down / bfly) and
  the warp vote family (ballot / all / any). Include one classical
  warp-reduce example: block-level sum of 1024 fp32 elements using
  butterfly reduction (__shfl_xor_sync).

  Skip match.sync and reduce.sync for now — they are deferred post-MVP.

  The agent must write its own compute-latency microbench probe for
  shfl.sync.bfly following hardware-microbench.md protocol. The canonical
  baseline (4096 trials, 128-unroll dependent chain) measured 23.83 cycles
  on H200 — the skill-specific probe should exercise the exact warp-reduce
  pattern and may show a different number.

  apis.md is REQUIRED for this skill because it touches __shfl_sync,
  __ballot_sync, and related intrinsics.
