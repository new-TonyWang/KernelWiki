notes: |
  Cover global memory coalescing: what it is, why it matters for memory-bound
  CUDA-core kernels, how the hardware coalesces warp-wide loads/stores into
  minimal transactions.

  Key topics:
  - Aligned vs misaligned access patterns (stride-1 contiguous = coalesced)
  - Strided access (stride > 1 per thread) and its cost
  - Structure-of-arrays (SoA) vs Array-of-Structures (AoS) layout impact
  - __ldg() and read-only data path
  - float4 / int4 vectorized loads as the "next level" of coalescing
  - L1/L2 cache line size (128 bytes on H200) and how it relates to coalescing

  apis.md is REQUIRED: touches __ldg, float4 vector types, potential
  cudaMemcpy patterns.

  The agent must write a memory-latency microbench probe following
  hardware-microbench.md §Memory pointer chasing protocol. The probe should
  compare COALESCED vs STRIDED global memory access latency on HBM. Use a
  simple kernel that reads N elements from global memory with:
    (a) stride-1 (coalesced): thread i reads array[i]
    (b) stride-32 (non-coalesced): thread i reads array[i * 32]
  Measure both with CUDA events (warmup 5, repeat 20). Record the bandwidth
  ratio to show the real cost of non-coalesced access.

  The canonical memory-latency baseline shows HBM pointer-chasing at 594.37
  cycles. The skill-specific probe should show effective bandwidth difference
  between coalesced and strided patterns.
