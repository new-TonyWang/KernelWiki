notes: |
  Cover compiler hints and launch configuration directives that influence
  register allocation, occupancy, and code generation.

  Key topics:
  - __launch_bounds__(maxThreadsPerBlock, minBlocksPerMultiprocessor)
    - How it constrains register allocation
    - Trade-off: fewer regs/thread → more blocks → higher occupancy
    - Risk: too tight → register spilling → local memory usage
  - -maxrregcount nvcc flag (global limit)
  - __restrict__ keyword (enables read-only data path + compiler optimizations)
  - volatile qualifier (prevents caching, forces memory access)
  - #pragma unroll N (explicit unroll factor)
  - __builtin_assume_aligned (alignment hint)
  - -Xptxas -v (how to read ptxas output: regs, smem, spills)
  - cudaFuncSetAttribute for dynamic shared memory opt-in

  apis.md is REQUIRED: __launch_bounds__, __restrict__, cudaFuncSetAttribute.

  Microbench probe: compare a simple kernel (e.g., vector add) with and
  without __launch_bounds__(256, 4). Measure occupancy difference via
  kp_introspect kernel-static (regs_per_thread), and latency difference
  via CUDA events. The point is to show the effect is real and measurable,
  not just theoretical.

  For the probe: write TWO kernels in the same .cu file — one with
  __launch_bounds__ and one without. Compile once, run both, compare.
