  - file_exists: TASK-PACKET.md
  - lint_clean: true

related_skills: [warp-primitives, coalescing, bank-conflict]

notes: |
  Build the pattern four-pack for the "reduction" operator under cuda-core/.

  INDEX.md — Decision tree for a reduction task:
    Step 0: Library check — can torch.sum / cub::DeviceReduce / thrust::reduce
      handle this shape+dtype? If yes, use the library. Only proceed to custom
      kernel if the library path is proven insufficient via benchmark.
    Step 1: If custom kernel needed, choose reduction strategy:
      - Warp-level: __shfl_xor_sync butterfly (≤32 elements per warp)
      - Block-level: shared memory tree reduction + warp-level final
      - Grid-level: multi-block with atomicAdd or two-pass
    Step 2: Optimization iteration — apply skills from ROUTING.md

  ROUTING.md — Skill whitelist for reduction:
    Must ONLY reference skills that exist under wiki/nvidia/foundations/:
      - wiki/nvidia/foundations/compute/warp-primitives/ (butterfly shuffle reduction)
      - wiki/nvidia/foundations/memory/coalescing/ (input array access pattern)
      - wiki/nvidia/foundations/memory/bank-conflict/ (shared memory reduction tree layout)
    Do NOT reference skills that don't exist yet (vectorized-access, ilp, etc.)

  library-fallback.md — Document the library paths:
    - torch.sum / torch.mean / torch.max — shapes, dtypes, device
    - cub::DeviceReduce::Sum / Reduce / Max / Min — API, usage, perf ranges
    - thrust::reduce — usage, when it's appropriate
    Grep upstream (cub/ and cuda-samples/) for concrete examples.

  TASK-PACKET.md — Operator-specific task packet template:
    Refines reasoning/task-packet.md for reduction specifically.
    Required fields: op=reduction, shape (M,N or flat), dtype, reduction_axis,
    reduction_op (sum/max/min/mean/argmax), baseline (torch.<op>).

  No microbench probe needed for pattern files — patterns reference skills,
  they don't produce measurements themselves.
