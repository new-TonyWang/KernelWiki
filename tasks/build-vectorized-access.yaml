notes: |
  Cover vectorized memory access: using float4/int4/uint4 vector types to
  issue 128-bit wide loads/stores instead of scalar 32-bit ones, achieving
  higher memory throughput on memory-bound kernels.

  Key topics:
  - float4, float2, int4, uint4, longlong2 vector types
  - reinterpret_cast<float4*> pattern for type-punning arrays
  - Alignment requirements (16-byte alignment for float4)
  - When to use: memory-bound kernels where N is divisible by vector width
  - Tail handling when N is not a multiple of 4
  - Interaction with coalescing (vectorized loads are inherently coalesced)
  - LDG.128 / STG.128 PTX instructions generated by the compiler

  apis.md is REQUIRED: float4, float2, int4, uint4, make_float4, etc.

  Microbench probe: compare scalar float load bandwidth vs float4 vectorized
  load bandwidth on HBM. Simple kernel that reads N floats from global memory:
    (a) scalar: thread i reads array[i] one float at a time
    (b) float4: thread i reads ((float4*)array)[i], processes 4 floats at once
  Measure effective bandwidth (GB/s) for both. Expect ~2-4x improvement.
