notes: |
  Cover shared memory bank conflict avoidance: what bank conflicts are,
  why they serialize shared memory accesses, and how to avoid them.

  Key topics:
  - 32 banks on H200 (4 bytes per bank, consecutive 4-byte words map to
    consecutive banks)
  - N-way bank conflict: N threads in the same warp access the same bank
    → access is serialized into N rounds
  - Broadcast: all threads read the SAME address in the same bank → no conflict
  - Padding trick: add 1 element padding per row to break stride-32 conflicts
    (e.g., __shared__ float tile[32][33] instead of [32][32])
  - Swizzle patterns for matrix tiles
  - Diagnosing bank conflicts via ncu metrics
    (l1tex__data_bank_conflicts_pipe_lsu_mem_shared)

  apis.md is OPTIONAL for this skill. If the agent finds no specific named
  APIs to list, skip it. Bank conflict avoidance is about access patterns
  and __shared__ memory layout, not about calling specific functions.

  The agent must write a shared-memory microbench probe following
  hardware-microbench.md §Memory pointer chasing protocol. The probe should
  compare smem access latency with different bank-conflict factors:
    (a) conflict-free: stride-1 access (thread i reads smem[i])
    (b) 2-way conflict: stride-2 access (thread i reads smem[i * 2])
    (c) 32-way conflict: all threads read smem[0] (broadcast case)
    (d) stride-32 conflict: thread i reads smem[i * 32] (worst case)
  Use clock64() for cycle-level measurement, 4096 samples.

  The canonical baseline shows smem pointer-chasing at 28.83 cycles
  (conflict-free). The probe should show how conflicts multiply this cost.
