notes: |
  Normalization operators: layernorm, rmsnorm, batchnorm, groupnorm.
  These are hybrid ops: per-element scaling (CUDA core) + per-channel/per-token
  reduction (warp/block reduce). The reduction axis distinguishes the variants.

  INDEX.md: library-first (torch.nn.functional.layer_norm / rms_norm /
  batch_norm / group_norm, cuDNN BatchNorm), then custom. Custom path
  combines reduction + elementwise scaling in one kernel.

  ROUTING.md: whitelist ONLY existing skills (all 10):
    warp-primitives, coalescing, bank-conflict, vectorized-access, fast-math,
    ilp, compiler-hints, register-pressure, async-copy, memory-ordering.
  Highlight warp-primitives (for the reduction phase) and coalescing +
  vectorized-access (for the elementwise scaling phase) as primary.

  library-fallback.md: torch.nn.functional variants + apex fused kernels.

  TASK-PACKET.md: op=normalization, norm_type (layernorm/rmsnorm/batchnorm/groupnorm),
  shape (B,S,H for layernorm; B,C,H,W for batchnorm), eps, affine (bool).
